# Unit and integration tests on every push and pull request. Tests that need tmux, Chrome, Xcode or adb skip themselves
# when the tool is missing; the real claude binary is never called (tests/helpers.mjs).
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node:sqlite (claude-mem import) needs 22.5 or later
      - run: sudo apt-get install -y tmux
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm test
